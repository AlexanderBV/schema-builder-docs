<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="schemaGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Contenedor Base Estilo App Icon -->
  <rect width="100" height="100" rx="24" fill="url(#schemaGrad)" />

  <!-- Marco Principal del Esquema (Ventana / Blueprint) -->
  <rect x="22" y="22" width="56" height="56" rx="10" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />

  <!-- Divisor Horizontal: Separa Cabecera/Formulario de la Tabla de Datos -->
  <path d="M22 43h56" stroke="#FFFFFF" stroke-width="5" />

  <!-- Divisor Vertical: Divide las Columnas de la Tabla -->
  <path d="M48 43v35" stroke="#FFFFFF" stroke-width="5" />

  <!-- Cabecera / Formulario: Input de Texto y Control Reactivo -->
  <line x1="31" y1="32.5" x2="52" y2="32.5" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="68" cy="32.5" r="3.5" fill="#38BDF8" />

  <!-- Columna Izquierda: Filas de la Tabla de Datos -->
  <line x1="31" y1="54" x2="39" y2="54" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="31" y1="65" x2="39" y2="65" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

  <!-- Columna Derecha: Validación / Acción Aprobada -->
  <path d="M57 61l4 4 9-9" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
